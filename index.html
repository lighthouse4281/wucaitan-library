<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1317">
<title>五彩滩图书馆</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0e1317;color:#d9e0e3;font-family:ui-monospace,SFMono-Regular,Consolas,"Noto Sans Mono",monospace}
main{width:min(920px,100%);margin:auto;min-height:100vh;padding:18px 16px 30px;display:flex;flex-direction:column}
header{padding:8px 0 16px;border-bottom:1px solid #273138;margin-bottom:18px}
.brand{font-size:20px;letter-spacing:.12em}
.status{font-size:12px;color:#708087;margin-top:5px}
#out{white-space:pre-wrap;word-break:break-word;line-height:1.85;min-height:56vh}
.controls{position:sticky;bottom:0;background:linear-gradient(transparent,#0e1317 18%);padding-top:16px}
.inputrow{display:flex;gap:8px}
#cmd{min-width:0;flex:1;background:#080b0e;color:#fff;border:1px solid #3b474e;border-radius:7px;padding:13px 12px;font:inherit;font-size:16px;outline:none}
#cmd:focus{border-color:#82cdd0}
#send{background:#18262b;color:#d9e0e3;border:1px solid #4a646b;border-radius:7px;padding:0 18px;font:inherit;min-width:70px}
#send:active{background:#263b42}
.quick{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.quick button{background:#121c20;color:#aebbc0;border:1px solid #2e3b41;border-radius:6px;padding:8px 10px;font:inherit}
.notice{font-size:12px;color:#66747b;margin-top:8px}
.cyan{color:#8bd4d7}.gold{color:#e3c982}.dim{color:#738087}.red{color:#df8585}
</style>
</head>
<body>
<main>
<header>
 <div class="brand" id="brand">五彩滩图书馆</div>
 <div class="status" id="status">现实入口 · 未确认身份</div>
</header>
<pre id="out"></pre>
<div class="controls">
 <div class="inputrow">
  <input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="输入……">
  <button id="send" type="button">确认</button>
 </div>
 <div class="quick" id="quick"></div>
 <div class="notice">手机可点击“确认”，电脑可直接按 Enter。</div>
</div>
</main>
<script>
const DEFAULT_DATA={
 title:"五彩滩图书馆",
 homeLines:[
  "海：欢迎",
  "海：这里是五彩滩图书馆的现实入口",
  "海：因为与现实链接，所以请原谅我使用现实式的身份确认方式"
 ],
 hint:["海：这里有一条给某人的提示：","海：狐狸的生日"],
 passes:[
  {id:"friend_jellyfish",code:"4281",name:"水母的朋友",admin:false},
  {id:"fox",code:"1212",name:"狐狸",admin:false},
  {id:"lighthouse_jellyfish",code:"xin",name:"灯塔水母",admin:true}
 ],
 sections:[
  {id:"section_a",name:"A区",description:"",books:[
   {id:"book_tide",name:"潮声备忘录",description:"",visibleTo:["friend_jellyfish","fox","lighthouse_jellyfish"],pages:[
    {text:"第一页：海风从很远的地方吹来。",image:"",caption:""},
    {text:"第二页：这里以后可以放真正的故事。",image:"",caption:""}
   ]},
   {id:"book_fox",name:"只给狐狸的册页",description:"",visibleTo:["fox","lighthouse_jellyfish"],pages:[
    {text:"这一页只对狐狸与灯塔水母开放。",image:"",caption:""}
   ]}
  ]},
  {id:"section_b",name:"B区",description:"",books:[
   {id:"book_admin",name:"未命名档案",description:"",visibleTo:["lighthouse_jellyfish"],pages:[
    {text:"这是管理员专用示例书。",image:"",caption:""}
   ]}
  ]},
  {id:"section_c",name:"C区",description:"",books:[]},
  {id:"section_d",name:"D区",description:"",books:[]}
 ],
 story:{
  start:"start",
  nodes:{
   start:{speaker:"海",text:"欢迎",choices:[{label:"继续",to:"reality"}]},
   reality:{speaker:"海",text:"这里是五彩滩图书馆的现实入口。",choices:[{label:"继续",to:"identity"}]},
   identity:{speaker:"海",text:"因为与现实链接，所以请原谅我使用现实式的身份确认方式。",choices:[
    {label:"输入验证",to:"verify"},
    {label:"提示",to:"hint"}
   ]}
  }
 }
};

let DATA=loadData();
let state="story", currentNode=DATA.story.start, pass=null, section=null, book=null, page=0, edit={};

const out=document.getElementById("out"),cmd=document.getElementById("cmd"),brand=document.getElementById("brand"),status=document.getElementById("status"),quick=document.getElementById("quick");

function clone(x){return JSON.parse(JSON.stringify(x))}
function loadData(){
 try{
  const x=JSON.parse(localStorage.getItem("wucaitan_v02"));
  if(x&&Array.isArray(x.passes)&&Array.isArray(x.sections)&&x.story)return x;
 }catch(e){}
 return clone(DEFAULT_DATA);
}
function saveData(){localStorage.setItem("wucaitan_v02",JSON.stringify(DATA))}
function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function render(text){
 out.textContent=text;
 out.scrollTop=out.scrollHeight;
 window.scrollTo(0,document.body.scrollHeight);
}
function setStatus(){
 brand.textContent=DATA.title;
 status.textContent=pass?("现实入口 · "+pass.name):"现实入口 · 未确认身份";
}
function buttons(items){
 quick.innerHTML="";
 (items||[]).forEach(([label,value])=>{
  const b=document.createElement("button");b.textContent=label;b.onclick=()=>{cmd.value=value;submit()};
  quick.appendChild(b);
 });
}
function show(s,btns=[]){render(s);buttons(btns);cmd.focus()}
function submit(){handle(cmd.value);cmd.value="";cmd.focus()}
document.getElementById("send").onclick=submit;
cmd.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();submit()}});
document.addEventListener("click",()=>cmd.focus());

function startStory(){
 state="story";currentNode=DATA.story.start;setStatus();showNode();
}
function showNode(){
 const n=DATA.story.nodes[currentNode];
 if(!n){startIntroFallback();return}
 let s="";
 if(n.speaker)s+=n.speaker+"：";
 s+=n.text+"\n\n";
 const choices=n.choices||[];
 choices.forEach((c,i)=>s+="["+(i+1)+"] "+c.label+"\n");
 if(!choices.length)s+="[回车] 继续\n";
 show(s,choices.map((c,i)=>[(i+1)+". "+c.label,String(i+1)]));
}
function chooseNode(x){
 const n=DATA.story.nodes[currentNode];
 const choices=n?.choices||[];
 if(!choices.length){library();return}
 const c=choices[Number(x)-1];
 if(!c){showNode();return}
 if(c.to==="verify"){verify();return}
 if(c.to==="hint"){hint();return}
 currentNode=c.to;showNode();
}
function startIntroFallback(){
 state="intro";
 show(DATA.homeLines.join("\n")+"\n\n[1] 输入验证\n[2] 提示\n[r] 重置本地数据\n\n请输入：",[
 ["1","1"],["2","2"]
 ]);
}
function verify(){state="verify";show("请输入现实数字：\n\n实际可以输入字母和数字。\n");}
function hint(){state="hint";show(DATA.hint.join("\n")+"\n\n[回车] 返回");}
function authenticate(code){
 const p=DATA.passes.find(p=>p.code===code);
 if(!p){show("海：……\n\n这串编号没有对应的记录。\n\n[回车] 返回");return state="hint"}
 pass=p;setStatus();
 show("正在确认……\n\n海："+p.name+"，你好。\n\n海：请进。\n\n[回车] 进入图书馆");
 state="afterAuth";
}
function library(){
 state="library";setStatus();
 let s=DATA.title+"\n\n海：欢迎来到图书馆。\n\n";
 DATA.sections.forEach((x,i)=>s+="["+(i+1)+"] "+x.name+"\n");
 s+="\n[0] 离开";
 if(pass?.admin)s+="\n[admin] 灯塔水母编辑室";
 show(s,DATA.sections.map((x,i)=>[(i+1)+". "+x.name,String(i+1)]).concat(pass?.admin?[["编辑室","admin"]]:[]));
}
function visibleBooks(sec){
 return sec.books.filter(b=>b.visibleTo.includes(pass?.id)||pass?.admin);
}
function showSection(sec){
 section=sec;state="section";
 let s="---------- "+sec.name+" ----------\n\n";
 if(sec.description)s+=sec.description+"\n\n";
 const books=visibleBooks(sec);
 books.forEach((b,i)=>s+="["+(i+1)+"] "+b.name+(b.description?" — "+b.description:"")+"\n");
 if(!books.length)s+="这里暂时没有你能看到的书目。\n";
 s+="\n[0] 返回图书馆";
 show(s,books.map((b,i)=>[(i+1)+". "+b.name,String(i+1)]));
}
function openBook(b){book=b;page=0;showBookPage()}
function showBookPage(){
 state="book";const p=book.pages[page]||{text:"",image:"",caption:""};
 let s="---------- "+book.name+" ----------\n\n";
 s+="第 "+(page+1)+" / "+book.pages.length+" 页\n\n";
 if(p.image)s+="[图片]\n"+p.image+"\n"+(p.caption?p.caption+"\n":"")+"\n";
 s+=(p.text||"")+"\n\n";
 s+="[回车] 下一页";
 if(page>0)s+="\n[q] 返回书架";
 show(s);
}
function nextPage(){if(page<book.pages.length-1){page++;showBookPage()}else showSection(section)}

function isAdmin(){return !!pass?.admin}

function adminHome(){
 if(!isAdmin())return library();
 state="admin";
 show("================================\n        灯塔水母 · 编辑室\n================================\n\n"+
 "这里是五彩滩图书馆的内容管理区域。\n\n"+
 "[1] 图书馆主页\n[2] 引入与剧情\n[3] 通行证\n[4] 图书馆分区\n[5] 书目\n[6] 书页与图片\n[7] 权限与可见性\n[8] 数据\n[0] 返回图书馆\n\n>",
 [["主页","1"],["剧情","2"],["通行证","3"],["分区","4"],["书目","5"],["书页","6"],["权限","7"],["数据","8"]]);
}
function adminHomeChoice(x){
 if(x==="0"){library();return}
 if(x==="1")adminHomepage();
 else if(x==="2")adminStory();
 else if(x==="3")adminPasses();
 else if(x==="4")adminSections();
 else if(x==="5")adminBooks();
 else if(x==="6")adminPageSelect();
 else if(x==="7")adminVisibility();
 else if(x==="8")adminData();
 else adminHome();
}

function adminHomepage(){
 state="adminHomepage";
 let s="========== 图书馆主页 ==========\n\n";
 s+="网站名称："+DATA.title+"\n\n";
 DATA.homeLines.forEach((x,i)=>s+="["+i+"] "+x+"\n");
 s+="\n修改名称：title=新名称\n修改文字：line=编号=新文字\n新增文字：add=新文字\n删除文字：del=编号\n\n[0] 返回";
 show(s);
}
function adminHomepageChoice(x){
 if(x==="0"){adminHome();return}
 if(x.startsWith("title=")){DATA.title=x.slice(6);saveData();setStatus();adminHomepage();return}
 if(x.startsWith("line=")){let a=x.slice(5).split("="),i=Number(a.shift());if(DATA.homeLines[i]!=null)DATA.homeLines[i]=a.join("=");saveData();adminHomepage();return}
 if(x.startsWith("add=")){DATA.homeLines.push(x.slice(4));saveData();adminHomepage();return}
 if(x.startsWith("del=")){DATA.homeLines.splice(Number(x.slice(4)),1);saveData();adminHomepage();return}
 adminHomepage();
}

function adminStory(){
 state="adminStory";
 const nodes=DATA.story.nodes;
 let s="========== 引入与剧情 ==========\n\n";
 Object.keys(nodes).forEach(id=>{
  const n=nodes[id];s+="["+id+"] "+(n.speaker?n.speaker+"：":"")+n.text+"\n";
  (n.choices||[]).forEach((c,i)=>s+="   → "+(i+1)+". "+c.label+" → "+c.to+"\n");
 });
 s+="\n编辑节点：edit=id|说话者|内容\n新增节点：add=id|说话者|内容\n删除节点：del=id\n新增分支：choice=id|选项文字|目标节点ID\n删除分支：choice-del=id|编号\n查看结构：tree\n";
 s+="\n当前入口："+DATA.story.start+"\n修改入口：start=节点ID\n\n[0] 返回";
 show(s);
}
function adminStoryChoice(x){
 if(x==="0"){adminHome();return}
 if(x==="tree"){adminStory();return}
 if(x.startsWith("start=")){DATA.story.start=x.slice(6);saveData();adminStory();return}
 if(x.startsWith("edit=")){
  const v=x.slice(5).split("|"),id=v.shift();
  if(DATA.story.nodes[id])DATA.story.nodes[id]={speaker:v[0]||"",text:v[1]||"",choices:DATA.story.nodes[id].choices||[]};
  saveData();adminStory();return;
 }
 if(x.startsWith("add=")){
  const v=x.slice(4).split("|"),id=v.shift();
  if(id&&!DATA.story.nodes[id])DATA.story.nodes[id]={speaker:v[0]||"",text:v[1]||"",choices:[]};
  saveData();adminStory();return;
 }
 if(x.startsWith("del=")){delete DATA.story.nodes[x.slice(4)];saveData();adminStory();return}
 if(x.startsWith("choice=")){
  const v=x.slice(7).split("|"),id=v.shift();
  if(DATA.story.nodes[id])DATA.story.nodes[id].choices.push({label:v[0]||"继续",to:v[1]||DATA.story.start});
  saveData();adminStory();return;
 }
 if(x.startsWith("choice-del=")){
  const v=x.slice(11).split("|"),id=v[0],i=Number(v[1]);
  if(DATA.story.nodes[id])DATA.story.nodes[id].choices.splice(i,1);
  saveData();adminStory();return;
 }
 adminStory();
}

function adminPasses(){
 state="adminPass";
 let s="========== 通行证 ==========\n\n";
 DATA.passes.forEach((p,i)=>s+="["+i+"] "+p.name+" | 内部ID："+p.id+(p.admin?" | 管理员":"")+"\n");
 s+="\n修改：edit=编号|内部ID|验证编号|显示名称|admin(true/false)\n新增：add=内部ID|验证编号|显示名称|admin(true/false)\n删除：del=编号\n\n注意：内部ID与验证编号不会显示给普通访客。\n\n[0] 返回";
 show(s);
}
function adminPassChoice(x){
 if(x==="0"){adminHome();return}
 if(x.startsWith("edit=")){
  const v=x.slice(5).split("|"),i=Number(v.shift());
  if(DATA.passes[i])DATA.passes[i]={id:v[0],code:v[1],name:v[2],admin:v[3]==="true"};
  saveData();adminPasses();return;
 }
 if(x.startsWith("add=")){
  const v=x.slice(4).split("|");if(v.length>=3)DATA.passes.push({id:v[0],code:v[1],name:v[2],admin:v[3]==="true"});
  saveData();adminPasses();return;
 }
 if(x.startsWith("del=")){DATA.passes.splice(Number(x.slice(4)),1);saveData();adminPasses();return}
 adminPasses();
}

function adminSections(){
 state="adminSection";
 let s="========== 图书馆分区 ==========\n\n";
 DATA.sections.forEach((a,i)=>s+="["+i+"] "+a.name+" | "+a.books.length+" 本书\n");
 s+="\n修改：edit=编号|新名称|描述\n新增：add=内部ID|名称|描述\n删除：del=编号\n\n[0] 返回";
 show(s);
}
function adminSectionChoice(x){
 if(x==="0"){adminHome();return}
 if(x.startsWith("edit=")){let v=x.slice(5).split("|"),i=Number(v.shift());if(DATA.sections[i]){DATA.sections[i].name=v[0]||DATA.sections[i].name;DATA.sections[i].description=v[1]||""}saveData();adminSections();return}
 if(x.startsWith("add=")){let v=x.slice(4).split("|");if(v.length>=2)DATA.sections.push({id:v[0],name:v[1],description:v[2]||"",books:[]});saveData();adminSections();return}
 if(x.startsWith("del=")){DATA.sections.splice(Number(x.slice(4)),1);saveData();adminSections();return}
 adminSections();
}

function allBookRefs(){
 const arr=[];DATA.sections.forEach((s,si)=>s.books.forEach((b,bi)=>arr.push({s,si,b,bi})));return arr;
}
function adminBooks(){
 state="adminBook";
 let s="========== 书目 ==========\n\n";
 DATA.sections.forEach((sct,si)=>{
  s+="【"+si+"】"+sct.name+"\n";
  sct.books.forEach((b,bi)=>s+="  ["+si+"."+bi+"] "+b.name+" | ID:"+b.id+"\n");
 });
 s+="\n修改：edit=分区,书目|内部ID|书名|简介\n新增：add=分区|内部ID|书名|简介\n删除：del=分区,书目\n编辑页面：pages=分区,书目\n\n[0] 返回";
 show(s);
}
function adminBookChoice(x){
 if(x==="0"){adminHome();return}
 if(x.startsWith("edit=")){let v=x.slice(5).split("|"),p=v.shift().split(","),b=DATA.sections[+p[0]]?.books[+p[1]];if(b){b.id=v[0]||b.id;b.name=v[1]||b.name;b.description=v[2]||""}saveData();adminBooks();return}
 if(x.startsWith("add=")){let v=x.slice(4).split("|"),s=DATA.sections[+v[0]];if(s)s.books.push({id:v[1],name:v[2],description:v[3]||"",visibleTo:DATA.passes.map(p=>p.id),pages:[{text:"新的一页",image:"",caption:""}]});saveData();adminBooks();return}
 if(x.startsWith("del=")){let p=x.slice(4).split(",");DATA.sections[+p[0]]?.books.splice(+p[1],1);saveData();adminBooks();return}
 if(x.startsWith("pages=")){let p=x.slice(6).split(",");if(DATA.sections[+p[0]]?.books[+p[1]]){edit={si:+p[0],bi:+p[1]};adminPages()}return}
 adminBooks();
}

function adminPageSelect(){
 state="adminPageSelect";
 let s="========== 书页与图片 ==========\n\n";
 s+="请选择要编辑的书目：\n\n";

 let count=0;
 DATA.sections.forEach((sct)=>{
  s+="【"+sct.name+"】\n";
  sct.books.forEach((b)=>{
   count++;
   s+="["+count+"] "+b.name+"\n";
  });
  s+="\n";
 });

 if(count===0) s+="目前还没有书目。\n";
 s+="请输入书目编号。\n";
 s+="[0] 返回编辑室";

 const btns=[];
 count=0;
 DATA.sections.forEach((sct)=>{
  sct.books.forEach((b)=>{
   count++;
   btns.push([String(count)+". "+b.name,String(count)]);
  });
 });
 btns.push(["返回","0"]);
 show(s,btns);
}

function adminPageSelectChoice(x){
 const value=String(x).trim();

 if(value==="0"){
  adminHome();
  return;
 }

 const target=Number(value)-1;

 if(!Number.isInteger(target)||target<0){
  adminPageSelect();
  return;
 }

 let count=0;
 for(let si=0;si<DATA.sections.length;si++){
  for(let bi=0;bi<DATA.sections[si].books.length;bi++){
   if(count===target){
    edit={si:si,bi:bi};
    adminPages();
    return;
   }
   count++;
  }
 }

 adminPageSelect();
}

function adminPages(){
 if(!edit || edit.si==null || edit.bi==null || !DATA.sections[edit.si] || !DATA.sections[edit.si].books[edit.bi]){
  adminPageSelect();
  return;
 }
 state="adminPage";
 const b=DATA.sections[edit.si].books[edit.bi];
 let s="========== 书页与图片 ==========\n\n《"+b.name+"》\n\n";
 b.pages.forEach((p,i)=>s+="["+i+"] "+(p.text||"(无文字)")+(p.image?" | 图片":"")+"\n");
 s+="\n修改文字：text=页码=内容\n修改图片：image=页码=图片地址\n图片说明：caption=页码=说明\n新增页面：add=文字|图片地址|图片说明\n删除页面：del=页码\n\n[0] 返回";
 show(s);
}

function adminPageSelectChoice(x){
 if(x==="0"){adminHome();return}
 const target=Number(x);
 if(!Number.isInteger(target)||target<0){adminPageSelect();return}
 let count=0;
 for(let si=0;si<DATA.sections.length;si++){
  for(let bi=0;bi<DATA.sections[si].books.length;bi++){
   if(count===target){
    edit={si,bi};
    adminPages();
    return;
   }
   count++;
  }
 }
 adminPageSelect();
}
function adminPageChoice(x){
 const b=DATA.sections[edit.si].books[edit.bi];
 if(x==="0"){adminBooks();return}
 if(x.startsWith("text=")){let a=x.slice(5).split("="),i=+a.shift();if(b.pages[i])b.pages[i].text=a.join("=");saveData();adminPages();return}
 if(x.startsWith("image=")){let a=x.slice(6).split("="),i=+a.shift();if(b.pages[i])b.pages[i].image=a.join("=");saveData();adminPages();return}
 if(x.startsWith("caption=")){let a=x.slice(8).split("="),i=+a.shift();if(b.pages[i])b.pages[i].caption=a.join("=");saveData();adminPages();return}
 if(x.startsWith("add=")){let v=x.slice(4).split("|");b.pages.push({text:v[0]||"",image:v[1]||"",caption:v[2]||""});saveData();adminPages();return}
 if(x.startsWith("del=")){b.pages.splice(+x.slice(4),1);saveData();adminPages();return}
 adminPages();
}

function adminVisibility(){
 state="adminVisibility";
 let s="========== 权限与可见性 ==========\n\n";
 DATA.sections.forEach((sct,si)=>sct.books.forEach((b,bi)=>{
  s+="["+si+","+bi+"] "+b.name+"\n  ";
  s+=b.visibleTo.map(id=>DATA.passes.find(p=>p.id===id)?.name||id).join("、")||"无人";
  s+="\n";
 }));
 s+="\n设置可见者：show=分区,书目|内部ID,内部ID\n全部隐藏：hide=分区,书目\n全部开放：all=分区,书目\n\n[0] 返回";
 show(s);
}
function adminVisibilityChoice(x){
 if(x==="0"){adminHome();return}
 if(x.startsWith("show=")){let v=x.slice(5).split("|"),p=v.shift().split(","),b=DATA.sections[+p[0]]?.books[+p[1]];if(b)b.visibleTo=v.join("|").split(",").filter(Boolean);saveData();adminVisibility();return}
 if(x.startsWith("hide=")){let p=x.slice(5).split(","),b=DATA.sections[+p[0]]?.books[+p[1]];if(b)b.visibleTo=[];saveData();adminVisibility();return}
 if(x.startsWith("all=")){let p=x.slice(4).split(","),b=DATA.sections[+p[0]]?.books[+p[1]];if(b)b.visibleTo=DATA.passes.map(p=>p.id);saveData();adminVisibility();return}
 adminVisibility();
}

function adminData(){
 state="adminData";
 show("========== 数据 ==========\n\n"+
 "[1] 导出 JSON 备份\n[2] 导入 JSON 备份\n[3] 导出当前网站\n[4] 恢复默认数据\n[0] 返回\n\n>"+
 "\n\n所有内容当前保存在此浏览器的 localStorage 中。",[
 ["导出","1"],["导入","2"],["恢复默认","3"]
 ]);
}
function adminDataChoice(x){
 if(x==="0"){adminHome();return}
 if(x==="1"){downloadData();adminData();return}
 if(x==="2"){importData();return}
 if(x==="3"){downloadWebsite();return}
 if(x==="4"){if(confirm("确定恢复默认数据？")){DATA=clone(DEFAULT_DATA);saveData();startStory()}else adminData();return}
 adminData();
}

function exportWebsite(){
  const cloneDoc=document.documentElement.cloneNode(true);
  const script=cloneDoc.querySelector("script");
  if(script){
    // Embed the current edited DATA directly into the exported site's startup code.
    const embedded="const EMBEDDED_DATA="+JSON.stringify(DATA)+";\n";
    script.textContent=script.textContent.replace(
      'const DEFAULT_DATA=',
      embedded+'const DEFAULT_DATA='
    ).replace(
      'let DATA=loadData();',
      'let DATA=loadData();\nif(typeof EMBEDDED_DATA!=="undefined"){DATA=clone(EMBEDDED_DATA);localStorage.setItem("wucaitan_v02",JSON.stringify(DATA));}'
    );
  }
  const finalHtml="<!doctype html>\n"+cloneDoc.outerHTML;
  const blob=new Blob([finalHtml],{type:"text/html;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="index.html";
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
function downloadWebsite(){exportWebsite()}
function downloadData(){
 const blob=new Blob([JSON.stringify(DATA,null,2)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="wucaitan-library.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importData(){
 const input=document.createElement("input");input.type="file";input.accept=".json,application/json";input.onchange=()=>{
  const f=input.files?.[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{
   try{const x=JSON.parse(r.result);if(!x.passes||!x.sections||!x.story)throw Error();DATA=x;saveData();adminHome()}catch(e){show("导入失败：文件格式不正确。\n\n[回车] 返回");state="adminData"}};
  r.readAsText(f,"utf-8");
 };input.click();
}

function handle(raw){
 const x=String(raw??"").trim();
 if(state==="story"){chooseNode(x);return}
 if(state==="intro"){
  if(x==="1")verify();else if(x==="2")hint();else if(x.toLowerCase()==="r"){DATA=clone(DEFAULT_DATA);saveData();startStory()}else startIntroFallback();return;
 }
 if(state==="hint"){startStory();return}
 if(state==="verify"){authenticate(x);return}
 if(state==="afterAuth"){library();return}
 if(state==="library"){
  if(x.toLowerCase()==="admin"&&isAdmin()){adminHome();return}
  if(x==="0"){startStory();return}
  const s=DATA.sections[+x-1];if(s)showSection(s);else library();return;
 }
 if(state==="section"){
  if(x.toLowerCase()==="admin"&&isAdmin()){adminHome();return}
  if(x==="0"){library();return}
  const books=visibleBooks(section),b=books[+x-1];if(b)openBook(b);else showSection(section);return;
 }
 if(state==="book"){if(x.toLowerCase()==="q")showSection(section);else nextPage();return}
 if(state==="admin")adminHomeChoice(x);
 else if(state==="adminHomepage")adminHomepageChoice(x);
 else if(state==="adminStory")adminStoryChoice(x);
 else if(state==="adminPass")adminPassChoice(x);
 else if(state==="adminSection")adminSectionChoice(x);
 else if(state==="adminBook")adminBookChoice(x);
 else if(state==="adminPageSelect")adminPageSelectChoice(x);
 else if(state==="adminPage")adminPageChoice(x);
 else if(state==="adminVisibility")adminVisibilityChoice(x);
 else if(state==="adminData")adminDataChoice(x);
 else startStory();
}

startStory();
</script>
