<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>五彩滩图书馆</title>
<style>
body{margin:0;background:#101418;color:#d8dde0;font-family:monospace;line-height:1.7}
main{max-width:900px;margin:auto;padding:20px;min-height:100vh;box-sizing:border-box}
pre{white-space:pre-wrap;word-break:break-word}
#out{min-height:75vh}
input{width:100%;box-sizing:border-box;background:#080b0d;color:#fff;border:0;border-bottom:1px solid #66737b;padding:12px 0;font:inherit;outline:0}
.dim{color:#77848b}.cyan{color:#8fd8d8}.gold{color:#e5cc82}.red{color:#df8888}
hr{border:0;border-top:1px solid #293239;margin:20px 0}
</style>
</head>
<body>
<main>
<pre id="out"></pre>
<input id="cmd" autofocus autocomplete="off" spellcheck="false" placeholder="输入指令，然后按回车……">
</main>
<script>
/*
  五彩滩图书馆 V0.1
  -----------------
  这是一个“裸文字交互”框架。
  主要内容都在 DATA 里。
  灯塔水母可以通过网页中的管理员菜单修改 DATA。
*/

const DEFAULT_DATA={
 title:"五彩滩图书馆",
 intro:[
  "海：欢迎",
  "海：这里是五彩滩图书馆的现实入口",
  "海：因为与现实链接，所以请原谅我使用现实式的身份确认方式"
 ],
 hint:["海：这里有一条给某人的提示：","海：狐狸的生日"],
 passes:[
  {code:"4281",name:"水母的朋友",level:1},
  {code:"1212",name:"狐狸",level:2},
  {code:"xin",name:"灯塔水母",level:99}
 ],
 sections:[
  {id:"A",name:"A区",books:[
   {id:"A001",name:"潮声备忘录",visible:[1,2,99],
    pages:[
     {text:"第一页：海风从很远的地方吹来。",image:""},
     {text:"第二页：这里以后可以放真正的故事。",image:""}
    ]},
   {id:"A002",name:"只给狐狸的册页",visible:[2,99],
    pages:[{text:"这一页只对狐狸与灯塔水母开放。",image:""}]}
  ]},
  {id:"B",name:"B区",books:[
   {id:"B001",name:"未命名档案",visible:[99],
    pages:[{text:"这是管理员专用示例书。",image:""}]}
  ]},
  {id:"C",name:"C区",books:[]},
  {id:"D",name:"D区",books:[]}
 ]
};

let DATA=load();
let state="intro";
let pass=null;
let section=null;
let book=null;
let page=0;
let editIndex=0;

const out=document.getElementById("out");
const cmd=document.getElementById("cmd");

function load(){
 try{
  const x=JSON.parse(localStorage.getItem("wucaitan_v01"));
  if(x&&x.passes&&x.sections)return x;
 }catch(e){}
 return structuredClone(DEFAULT_DATA);
}
function save(){localStorage.setItem("wucaitan_v01",JSON.stringify(DATA));}
function clearSave(){localStorage.removeItem("wucaitan_v01");}
function print(s="",cls=""){
 out.innerHTML+=`<span class="${cls}">${escapeHtml(s)}</span>\n`;
 out.scrollTop=out.scrollHeight;
 window.scrollTo(0,document.body.scrollHeight);
}
function replace(s,cls=""){
 out.innerHTML=`<span class="${cls}">${escapeHtml(s)}</span>\n`;
}
function escapeHtml(s){
 return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function promptText(s=""){
 print("");
 print(s,"dim");
}
function start(){
 state="intro";
 replace("================================\n       "+DATA.title+"\n================================\n");
 DATA.intro.forEach(x=>print(x));
 print("\n[1] 输入验证\n[2] 提示\n\n[r] 重置本地数据\n\n请输入：","cyan");
}
function enter(raw){
 const x=String(raw??"").trim();

 // After successful authentication, Enter moves into the library.
 if(state==="afterAuth"){
   library();
   return;
 }

 if(state==="book" && x===""){
   nextPage();
   return;
 }

 switch(state){
  case "intro":
   if(x==="1") verify();
   else if(x==="2") hint();
   else if(x.toLowerCase()==="r"){ DATA=structuredClone(DEFAULT_DATA); save(); start(); }
   else {
     print("\n请输入 1 或 2。","red");
   }
   break;

  case "hint":
   // Any Enter returns to the branch menu.
   start();
   break;

  case "verify":
   authenticate(x);
   break;

  case "library":
   libraryChoice(x);
   break;

  case "section":
   sectionChoice(x);
   break;

  case "book":
   if(x.toLowerCase()==="q") showSection(section);
   else nextPage();
   break;

  case "admin":
   adminChoice(x);
   break;

  case "adminPass":
   adminPassChoice(x);
   break;

  case "adminSection":
   adminSectionChoice(x);
   break;

  case "adminBook":
   adminBookChoice(x);
   break;

  case "adminPage":
   adminPageChoice(x);
   break;

  case "adminIntro":
   adminIntroChoice(x);
   break;

  case "adminExport":
   adminExportChoice(x);
   break;

  default:
   start();
 }
 cmd.value="";
 cmd.focus();
}
function verify(){
 state="verify";
 replace("请输入现实数字：\n\n实际可以输入字母和数字。\n");
 print(">");
}
function hint(){
 state="hint";
 replace(DATA.hint.join("\n")+"\n\n[回车] 返回");
}
function authenticate(code){
 const p=DATA.passes.find(p=>p.code===code);
 if(!p){
  replace("海：……\n\n这串编号没有对应的记录。\n\n[回车] 返回");
  state="hint";return;
 }
 pass=p;
 replace("正在确认……\n\n编号："+p.code+"\n通行证："+p.name+"\n等级："+p.level+
 "\n\n海：你好，"+p.name+"。\n\n海：请进。\n\n[回车] 进入图书馆");
 state="afterAuth";
}
function libraryChoice(x){
 if(x.toLowerCase()==="admin" && isAdmin()){admin();return}
 const n=Number(x);
 if(n===0){start();return}
 if(DATA.sections[n-1])showSection(DATA.sections[n-1]);
 else library();
}
function library(){
 state="library";
 let s="================================\n       "+DATA.title+"\n================================\n\n";
 s+="访客："+pass.name+"    等级："+pass.level+"\n\n";
 DATA.sections.forEach((x,i)=>s+="["+ (i+1) +"] "+x.name+"\n");
 s+="[0] 离开\n\n>";
 replace(s);
}
function showSection(s){
 section=s;state="section";
 let text="---------- "+s.name+" ----------\n\n";
 const books=s.books.filter(b=>b.visible.includes(pass.level));
 if(!books.length)text+="这里暂时没有你能看到的书目。\n\n";
 books.forEach((b,i)=>text+="["+(i+1)+"] "+b.name+"\n");
 text+="\n[0] 返回图书馆\n\n>";
 replace(text);
}
function sectionChoice(x){
 if(x.toLowerCase()==="admin" && isAdmin()){admin();return}
 if(x==="0"){library();return}
 const books=section.books.filter(b=>b.visible.includes(pass.level));
 const b=books[Number(x)-1];
 if(b){openBook(b)}else showSection(section);
}
function openBook(b){
 book=b;page=0;showPage();
}
function showPage(){
 state="book";
 const p=book.pages[page];
 let s="---------- "+book.name+" ----------\n\n";
 s+="第 "+(page+1)+" / "+book.pages.length+" 页\n\n";
 if(p.image)s+="[图片]\n"+p.image+"\n\n";
 s+=(p.text||"")+"\n\n";
 s+="[回车] 下一页";
 if(page>0)s+="\n[q] 返回书架";
 replace(s);
}
function nextPage(){
 if(page<book.pages.length-1){page++;showPage()}
 else showSection(section);
}

function isAdmin(){return pass&&pass.level===99 && pass.name==="灯塔水母"}

function admin(){
 if(!isAdmin()){library();return}
 state="admin";
 replace(
 "================================\n"+
 "       灯塔水母 · 编辑室\n"+
 "================================\n\n"+
 "这里不是“后台代码”，而是一组文字菜单。\n"+
 "修改会立即保存到当前浏览器。\n\n"+
 "[1] 编辑入口对白 / 提示\n"+
 "[2] 编辑通行证\n"+
 "[3] 编辑图书馆分区\n"+
 "[4] 编辑书目\n"+
 "[5] 导出完整数据\n"+
 "[6] 导入数据\n"+
 "[7] 恢复默认数据\n"+
 "[0] 返回图书馆\n\n>"
 );
}
function adminChoice(x){
 if(x==="1")adminIntro();
 else if(x==="2")adminPasses();
 else if(x==="3")adminSections();
 else if(x==="4")adminBooks();
 else if(x==="5")exportData();
 else if(x==="6")adminImport();
 else if(x==="7"){if(confirm("确定恢复最初数据？")){DATA=structuredClone(DEFAULT_DATA);save();admin()}}
 else if(x==="0")library();
 else admin();
}

function adminIntro(){
 state="adminIntro";
 let s="========== 编辑入口 ==========\n\n";
 s+="当前网站名："+DATA.title+"\n";
 s+="输入：title=新名称\n\n";
 s+="开场对白：\n";
 DATA.intro.forEach((x,i)=>s+="["+i+"] "+x+"\n");
 s+="\n输入：intro=编号=新内容\n";
 s+="输入：intro+新对白\n";
 s+="输入：intro-编号\n\n";
 s+="提示内容：\n";
 DATA.hint.forEach((x,i)=>s+="["+i+"] "+x+"\n");
 s+="\n输入：hint=编号=新内容\n";
 s+="输入：hint+新提示\n";
 s+="输入：hint-编号\n\n";
 s+="[0] 返回管理员菜单\n>";
 replace(s);
}
function adminIntroChoice(x){
 if(x==="0"){admin();return}
 if(x.startsWith("title=")){DATA.title=x.slice(6);save();adminIntro();return}
 if(x.startsWith("intro+")){DATA.intro.push(x.slice(6));save();adminIntro();return}
 if(x.startsWith("intro-")){DATA.intro.splice(Number(x.slice(6)),1);save();adminIntro();return}
 if(x.startsWith("intro=")){let a=x.slice(6).split("=");let i=Number(a.shift());DATA.intro[i]=a.join("=");save();adminIntro();return}
 if(x.startsWith("hint+")){DATA.hint.push(x.slice(5));save();adminIntro();return}
 if(x.startsWith("hint-")){DATA.hint.splice(Number(x.slice(5)),1);save();adminIntro();return}
 if(x.startsWith("hint=")){let a=x.slice(5).split("=");let i=Number(a.shift());DATA.hint[i]=a.join("=");save();adminIntro();return}
 adminIntro();
}

function adminPasses(){
 state="adminPass";
 let s="========== 通行证编辑 ==========\n\n";
 DATA.passes.forEach((p,i)=>{
  s+="["+i+"] "+p.name+" | 编号："+p.code+" | 等级："+p.level+"\n";
 });
 s+="\n修改：edit=编号=编号|名称|等级\n";
 s+="新增：add=编号|名称|等级\n";
 s+="删除：del=编号\n";
 s+="[0] 返回\n\n>";
 replace(s);
}
function adminPassChoice(x){
 if(x==="0"){admin();return}
 if(x.startsWith("edit=")){
  const a=x.slice(5).split("=");
  const i=Number(a.shift()),v=a.join("=").split("|");
  if(DATA.passes[i]&&v.length>=3){
   DATA.passes[i]={code:v[0],name:v[1],level:Number(v[2])};
   save();
  }
  adminPasses();return;
 }
 if(x.startsWith("add=")){
  const v=x.slice(4).split("|");
  if(v.length>=3)DATA.passes.push({code:v[0],name:v[1],level:Number(v[2])});
  save();adminPasses();return;
 }
 if(x.startsWith("del=")){
  DATA.passes.splice(Number(x.slice(4)),1);save();adminPasses();return;
 }
 adminPasses();
}

function adminSections(){
 state="adminSection";
 let s="========== 分区编辑 ==========\n\n";
 DATA.sections.forEach((a,i)=>s+="["+i+"] "+a.id+" | "+a.name+" | "+a.books.length+" 本书\n");
 s+="\n修改名称：name=编号=新名称\n";
 s+="新增分区：add=分区编号|分区名称\n";
 s+="删除分区：del=编号\n";
 s+="[0] 返回\n\n>";
 replace(s);
}
function adminSectionChoice(x){
 if(x==="0"){admin();return}
 if(x.startsWith("name=")){
  let a=x.slice(5).split("="),i=Number(a.shift());
  if(DATA.sections[i])DATA.sections[i].name=a.join("=");
  save();adminSections();return;
 }
 if(x.startsWith("add=")){
  let v=x.slice(4).split("|");
  if(v.length>=2)DATA.sections.push({id:v[0],name:v[1],books:[]});
  save();adminSections();return;
 }
 if(x.startsWith("del=")){
  DATA.sections.splice(Number(x.slice(4)),1);save();adminSections();return;
 }
 adminSections();
}

function adminBooks(){
 state="adminBook";
 let s="========== 书目编辑 ==========\n\n";
 DATA.sections.forEach((a,si)=>{
  s+="【"+si+"】"+a.name+"\n";
  a.books.forEach((b,bi)=>{
   s+="  ["+si+"."+bi+"] "+b.name+" | 开放等级："+b.visible.join(",")+"\n";
  });
 });
 s+="\n编辑书目：edit=分区编号,书目编号=新名称\n";
 s+="新增书目：add=分区编号|书目编号|书名\n";
 s+="删除书目：del=分区编号,书目编号\n";
 s+="权限：show=分区编号,书目编号=等级1,等级2\n";
 s+="内容：book=分区编号,书目编号\n";
 s+="[0] 返回\n\n>";
 replace(s);
}
function adminBookChoice(x){
 if(x==="0"){admin();return}
 if(x.startsWith("edit=")){
  let a=x.slice(5).split("="),pos=a.shift().split(","),name=a.join("=");
  let b=DATA.sections[Number(pos[0])]?.books[Number(pos[1])];
  if(b)b.name=name;save();adminBooks();return;
 }
 if(x.startsWith("add=")){
  let v=x.slice(4).split("|"),s=DATA.sections[Number(v[0])];
  if(s&&v.length>=3)s.books.push({id:v[1],name:v[2],visible:DATA.passes.map(p=>p.level),pages:[{text:"新的一页",image:""}]});
  save();adminBooks();return;
 }
 if(x.startsWith("del=")){
  let p=x.slice(4).split(",");
  DATA.sections[Number(p[0])]?.books.splice(Number(p[1]),1);
  save();adminBooks();return;
 }
 if(x.startsWith("show=")){
  let a=x.slice(5).split("="),p=a.shift().split(","),levels=a.join("=").split(",").map(Number);
  let b=DATA.sections[Number(p[0])]?.books[Number(p[1])];
  if(b)b.visible=levels.filter(n=>!Number.isNaN(n));
  save();adminBooks();return;
 }
 if(x.startsWith("book=")){
  let p=x.slice(5).split(",");
  const b=DATA.sections[Number(p[0])]?.books[Number(p[1])];
  if(b){editIndex={si:Number(p[0]),bi:Number(p[1])};adminBookPages();}
  return;
 }
 adminBooks();
}

function adminBookPages(){
 state="adminPage";
 const b=DATA.sections[editIndex.si].books[editIndex.bi];
 let s="========== 页面编辑 ==========\n\n";
 s+="书名："+b.name+"\n\n";
 b.pages.forEach((p,i)=>{
  s+="["+i+"] "+(p.text||"(无文字)")+"\n";
  if(p.image)s+="    图片："+p.image+"\n";
 });
 s+="\n修改文字：text=页码=内容\n";
 s+="修改图片：image=页码=图片地址\n";
 s+="新增页面：add=文字|图片地址\n";
 s+="删除页面：del=页码\n";
 s+="[0] 返回书目列表\n\n>";
 replace(s);
}
function adminPageChoice(x){
 const b=DATA.sections[editIndex.si].books[editIndex.bi];
 if(x==="0"){adminBooks();return}
 if(x.startsWith("text=")){
  let a=x.slice(5).split("="),i=Number(a.shift());
  if(b.pages[i])b.pages[i].text=a.join("=");
  save();adminBookPages();return;
 }
 if(x.startsWith("image=")){
  let a=x.slice(6).split("="),i=Number(a.shift());
  if(b.pages[i])b.pages[i].image=a.join("=");
  save();adminBookPages();return;
 }
 if(x.startsWith("add=")){
  let v=x.slice(4).split("|");b.pages.push({text:v[0]||"",image:v[1]||""});
  save();adminBookPages();return;
 }
 if(x.startsWith("del=")){b.pages.splice(Number(x.slice(4)),1);save();adminBookPages();return}
 adminBookPages();
}

function exportData(){
 state="adminExport";
 const blob=new Blob([JSON.stringify(DATA,null,2)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="wucaitan-library.json";a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);
 replace("已生成 wucaitan-library.json。\n\n[回车] 返回管理员菜单");
}
function adminExportChoice(){admin()}

function adminImport(){
 state="adminExport";
 replace("选择之前导出的 wucaitan-library.json 文件。\n\n");
 const input=document.createElement("input");
 input.type="file";
 input.accept=".json,application/json";
 input.style.display="none";
 document.body.appendChild(input);
 input.onchange=()=>{
   const file=input.files && input.files[0];
   if(!file){ input.remove(); admin(); return; }
   const reader=new FileReader();
   reader.onload=()=>{
     try{
       const x=JSON.parse(reader.result);
       if(!x || !Array.isArray(x.passes) || !Array.isArray(x.sections))
         throw new Error("invalid");
       DATA=x;
       save();
       input.remove();
       admin();
     }catch(e){
       input.remove();
       replace("导入失败：这不是有效的五彩滩图书馆数据文件。\n\n[回车] 返回");
       state="adminExport";
     }
   };
   reader.readAsText(file,"utf-8");
 };
 input.click();
}

cmd.addEventListener("keydown",e=>{
 if(e.key==="Enter"){
   e.preventDefault();
   const value=cmd.value;
   enter(value);
 }
});
document.addEventListener("click",()=>cmd.focus());
window.addEventListener("load",()=>setTimeout(()=>cmd.focus(),100));

/* 管理员入口：灯塔水母进入图书馆后输入 admin */
const oldLibraryChoice=libraryChoice;
libraryChoice=function(x){
 if(x.toLowerCase()==="admin" && isAdmin()){admin();return}
 oldLibraryChoice(x);
};

/* 普通书架中也可以输入 admin */
const oldSectionChoice=sectionChoice;
sectionChoice=function(x){
 if(x.toLowerCase()==="admin" && isAdmin()){admin();return}
 oldSectionChoice(x);
};

start();
</script>
</body>
</html>
