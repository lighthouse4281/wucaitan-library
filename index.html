<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1317">
<title>五彩滩图书馆</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% 0%,#cdb38d 0%,#9a7652 25%,#62452f 57%,#2a1a11 100%);color:#f2e7d4;font-family:ui-monospace,SFMono-Regular,Consolas,"Noto Sans Mono",monospace}
main{width:min(920px,100%);margin:auto;min-height:100vh;padding:18px 16px 30px;display:flex;flex-direction:column}
header{padding:8px 0 16px;border-bottom:1px solid rgba(238,220,190,.28);margin-bottom:18px}
.brand{font-size:20px;letter-spacing:.12em}
.status{font-size:12px;color:#d4bea0;margin-top:5px}
#out{white-space:pre-wrap;word-break:break-word;line-height:1.85;min-height:56vh}
.controls{position:sticky;bottom:0;background:linear-gradient(transparent,#2a1a11 18%);padding-top:16px}
.inputrow{display:flex;gap:8px}
#cmd{min-width:0;flex:1;background:rgba(31,19,12,.82);color:#f7eddd;border:1px solid #85694b;border-radius:7px;padding:13px 12px;font:inherit;font-size:16px;outline:none}
#cmd:focus{border-color:var(--theme-color,#82cdd0)}
#send{background:#4a3222;color:#f0dfc6;border:1px solid #967654;border-radius:7px;padding:0 18px;font:inherit;min-width:70px}
#send:active{background:#67472f}
.quick{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.quick button{background:#4a3222;color:#ead8bd;border:1px solid #806246;border-radius:6px;padding:8px 10px;font:inherit}
.notice{font-size:12px;color:#c8b092;margin-top:8px}
.cyan{color:#e6c79a}.gold{color:#e3c982}.dim{color:#b89f81}.red{color:#df8585}
</style>
</head>
<body>
<main>
<header>
 <div class="brand" id="brand">五彩滩图书馆</div>
 <div class="status" id="status">从现实到图书馆的入口 · 幽灵</div>
</header>
<pre id="out"></pre>
<div class="controls">
 <div class="inputrow">
  <input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="输入……">
  <button id="send" type="button">确认</button>
 </div>
 <div class="quick" id="quick"></div>
 
</div>
</main>
<script>
const DEFAULT_DATA={
 title:"五彩滩图书馆",
 themeColor:"#82cdd0",
 display:{
  typewriter:{
   entrance:false,story:true,intro:true,seaDialog:true,shelfVN:true,placeholder:true,
   surveyChoice:false,surveyResult:false,book:false,library:false,scene:false,
   admin:false,adminHomepage:false,adminStory:false,adminPass:false,adminSection:false,
   adminBook:false,adminPageSelect:false,adminPage:false,adminVisibility:false,adminData:false,adminTheme:false
  }
 },
 homeLines:[
  "海：欢迎",
  "海：这里是五彩滩图书馆的一个入口",
  "海：这是第一个与现实链接的入口，请原谅我使用无趣的身份确认方式"
 ],
 hint:["海：现实密文的线索当然藏在现实之中","海：如果还是有疑惑，可以询问给你邀请的人"],
 passes:[
  {id:"friend_jellyfish",code:"4281",name:"水母的朋友",admin:false},
  {id:"fox",code:"1212",name:"狐狸",admin:false},
  {id:"lighthouse_jellyfish",code:"真心",name:"灯塔水母",admin:true}
 ],
 sections:[
  {id:"section_a",name:"A区",description:"",books:[
   {id:"book_tide",shelf:"a_window",name:"所有故事的故事",description:"",visibleTo:["friend_jellyfish","fox","lighthouse_jellyfish"],pages:[
    {text:"第一页：所有故事的开始。",image:"",caption:""},
    {text:"第二页：所有故事的结局。",image:"",caption:""}
   ]},
   {id:"book_fox",shelf:"a_high",name:"给狐狸",description:"",visibleTo:["fox","lighthouse_jellyfish"],pages:[
    {text:"这一页只对狐狸开放。",image:"",caption:""}
   ]}
  ]},
  {id:"section_b",name:"B区",description:"",books:[
   {id:"book_admin",shelf:"b_narrow",name:"未命名档案",description:"",visibleTo:["lighthouse_jellyfish"],pages:[
    {text:"这是管理员专用示例书。",image:"",caption:""}
   ]}
  ]},
  {id:"section_c",name:"C区",description:"",books:[]},
  {id:"section_d",name:"D区",description:"",books:[]}
 ],
 shelves:{
  section_a:[
   {id:"a_window",name:"靠窗的书架"},
   {id:"a_high",name:"高处的书架"},
   {id:"a_dust",name:"被灰尘覆盖的书架"}
  ],
  section_b:[
   {id:"b_narrow",name:"狭窄的书架"},
   {id:"b_unordered",name:"无人整理的书架"}
  ],
  section_c:[],section_d:[]
 },
 shelfDialogues:{
  default:["站在书架前。"],
  fox:["站在书架前。"],
  friend_jellyfish:["站在书架前。"],
  lighthouse_jellyfish:["站在书架前。"]
 },
 story:{
  start:"start",
  nodes:{
   start:{speaker:"海",text:"欢迎",choices:[{label:"继续",to:"reality"}]},
   reality:{speaker:"海",text:"这是五彩滩图书馆的一个入口。",choices:[{label:"继续",to:"identity"}]},
   identity:{speaker:"海",text:"这是第一个与现实链接的入口，请原谅我使用无聊的身份确认方式。",choices:[
    {label:"输入现实密文",to:"verify"},
    {label:"线索",to:"hint"}
   ]}
  }
 }
};

let DATA=loadData();
if(!DATA.shelves)DATA.shelves={section_a:[{id:"a_window",name:"靠窗的书架"},{id:"a_high",name:"高处的书架"},{id:"a_dust",name:"被灰尘覆盖的书架"}],section_b:[{id:"b_narrow",name:"狭窄的书架"},{id:"b_unordered",name:"无人整理的书架"}],section_c:[],section_d:[]};
if(!DATA.shelfDialogues)DATA.shelfDialogues=clone(DEFAULT_DATA.shelfDialogues);
if(!DATA.display)DATA.display=clone(DEFAULT_DATA.display);
if(!DATA.display.typewriter)DATA.display.typewriter=clone(DEFAULT_DATA.display.typewriter);
else Object.keys(DEFAULT_DATA.display.typewriter).forEach(k=>{if(typeof DATA.display.typewriter[k]!=="boolean")DATA.display.typewriter[k]=DEFAULT_DATA.display.typewriter[k]});
let state="entrance", currentNode=DATA.story.start, pass=null, section=null, book=null, page=0, edit={}, survey={shelf:null,attempts:{},dialogLines:[],dialogIndex:0,results:[],resultIndex:0,foundByShelf:{}};
try{const savedPassId=localStorage.getItem("wucaitan_v04_pass");if(savedPassId){pass=DATA.passes.find(p=>p.id===savedPassId)||null}}catch(e){}
try{survey.foundByShelf=JSON.parse(localStorage.getItem("wucaitan_v04_found")||"{}")}catch(e){survey.foundByShelf={}}

const out=document.getElementById("out"),cmd=document.getElementById("cmd"),brand=document.getElementById("brand"),status=document.getElementById("status"),quick=document.getElementById("quick");
let typingTimer=null,typingActive=false,typingTarget="",typingIndex=0,typingButtons=[];
applyThemeColor();

function clone(x){return JSON.parse(JSON.stringify(x))}
function loadData(){
 try{
  const x=JSON.parse(localStorage.getItem("wucaitan_v02"));
  if(x&&Array.isArray(x.passes)&&Array.isArray(x.sections)&&x.story)return x;
 }catch(e){}
 return clone(DEFAULT_DATA);
}
function saveData(){localStorage.setItem("wucaitan_v02",JSON.stringify(DATA))}
function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function render(text){
 out.textContent=text;
 out.scrollTop=out.scrollHeight;
 window.scrollTo(0,document.body.scrollHeight);
}
function typewriterEnabled(){
 const map=DATA.display?.typewriter||{};
 return map[state]===true;
}
function stopTyping(){
 if(typingTimer){clearInterval(typingTimer);typingTimer=null}
 typingActive=false;
}
function finishTyping(){
 stopTyping();
 render(typingTarget);
 buttons(typingButtons);
}
function renderWithTypewriter(text,btns=[]){
 stopTyping();
 typingTarget=String(text??"");typingButtons=btns||[];
 if(!typewriterEnabled()){render(typingTarget);buttons(typingButtons);return}
 typingActive=true;typingIndex=0;render("");
 typingTimer=setInterval(()=>{
  typingIndex++;
  render(typingTarget.slice(0,typingIndex));
  if(typingIndex>=typingTarget.length)finishTyping();
 },Math.max(18,Math.min(65,700/Math.max(typingTarget.length,1))));
}

function setStatus(){
 brand.textContent=DATA.title;
 status.textContent=pass?("现实入口 · "+pass.name):"现实入口 · 未确认身份";
 applyThemeColor();
}
function validColor(v){
 return /^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(String(v||"").trim());
}
function applyThemeColor(){
 const c=validColor(DATA.themeColor)?DATA.themeColor:"#82cdd0";
 document.documentElement.style.setProperty("--theme-color",c);
 const meta=document.querySelector('meta[name="theme-color"]');
 if(meta)meta.setAttribute("content","#2a1a11");
}
function buttons(items){
 quick.innerHTML="";
 (items||[]).forEach(([label,value])=>{
  const b=document.createElement("button");b.textContent=label;b.onclick=()=>{if(typingActive)finishTyping();cmd.value=value;submit()};
  quick.appendChild(b);
 });
}
function show(s,btns=[]){renderWithTypewriter(s,btns);}
function submit(){handle(cmd.value);cmd.value="";}
document.getElementById("send").onclick=submit;
cmd.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();if(typingActive){finishTyping();return}submit()}});


function startStory(){
 state="entrance";setStatus();
 let s="----------图书馆入口-----------\n\n";
 s+="               海              \n\n";
 if(pass)s+="已经拥有自己的通行证。\n\n";
 s+="[图书馆入口]\n[海]";
 if(pass)s+="\n[再次输入密文]";
 const bs=[["图书馆入口","libraryEnter"],["海","seaEnter"]];
 if(pass)bs.push(["再次输入密文","reverify"]);
 show(s,bs);
}
function seaEnter(){
 if(!pass){startOriginalIntro();return}
 seaDialogue();
}
function libraryEnter(){
 if(!pass){startOriginalIntro();return}
 library();
}
function reverify(){state="verify";show("请输入现实密文：\n\n以防你是个大人，这里可以输入字母和数字。\n");}
function startOriginalIntro(){state="story";currentNode=DATA.story.start;showNode();}
function showNode(){
 const n=DATA.story.nodes[currentNode];
 if(!n){startIntroFallback();return}
 let s="";
 if(n.speaker)s+=n.speaker+"：";
 s+=n.text+"\n\n";
 const choices=n.choices||[];
 choices.forEach((c,i)=>s+="["+(i+1)+"] "+c.label+"\n");
 if(!choices.length)s+="[回车] 继续\n";
 show(s,choices.map((c,i)=>[(i+1)+". "+c.label,String(i+1)]));
}
function chooseNode(x){
 const n=DATA.story.nodes[currentNode];
 const choices=n?.choices||[];
 if(!choices.length){library();return}
 const c=choices[Number(x)-1];
 if(!c){showNode();return}
 if(c.to==="verify"){verify();return}
 if(c.to==="hint"){hint();return}
 currentNode=c.to;showNode();
}
function startIntroFallback(){
 state="intro";
 show(DATA.homeLines.join("\n")+"\n\n[1] 输入现实密文\n[2] 提示\n[r] 重置本地数据\n\n请输入：",[
 ["1","1"],["2","2"]
 ]);
}
function seaDialogue(){
 state="seaMenu";
 let n=pass?.name||"未知的访客";
 show("海：请问有什么事吗？"+n+"\n\n[1] 这里是哪里？你是谁？\n[2] 听大人话\n[0] 再见",[["1","1"],["2","2"],["0","0"]]);
}
function seaChoice(x){
 if(x==="0"){startStory();return}
 let id=pass?.id||"";
 let lines=[];
 if(x==="1"){
  if(id==="fox") lines=["海：你好，尊敬的狐狸","海：这里是五彩滩图书馆","海：不知道你是否记得","海：在创造这个地方时，你曾做出很大的贡献","海：我是海，一位幽灵","海：祝你在这里过得愉快"];
  else lines=["海：这里是五彩滩图书馆，当然，只是一部分","海：我是海，如你所见","海：虽然还未完全完工，不过祝你在这里过得愉快"];
 }else if(x==="2"){
  if(id==="friend_jellyfish") lines=["海：诚挚欢迎莅临"];
  else if(id==="fox"||id==="lighthouse_jellyfish") lines=["海：请放心，我不会对你说那些话"];
  else lines=["海：……","海没有回答"];
 }
 survey.dialogLines=lines;survey.dialogIndex=0;state="seaDialog";showSeaLine();
}
function showSeaLine(){
 const i=survey.dialogIndex, lines=survey.dialogLines;
 if(i>=lines.length){seaDialogue();return}
 show(lines[i],[[i<lines.length-1?"继续":"回到海","nextSea"]]);
}
function nextSea(){survey.dialogIndex++;showSeaLine()}
function verify(){state="verify";show("请输入现实密文：\n\n如果你是大人，那么这句话的意思是请输入字母和数字。\n");}
function hint(){state="hint";show(DATA.hint.join("\n")+"\n\n[回车] 返回");}
function authenticate(code){
 const p=DATA.passes.find(p=>p.code===code);
 if(!p){state="verifyFail";show("海：非常遗憾……\n\n这串密文没有效果。\n\n[回车] 返回",[["返回","backEntrance"]]);return}
 pass=p;try{localStorage.setItem("wucaitan_v04_pass",p.id)}catch(e){}setStatus();state="afterAuth";
 show("海：你好，+p.name+。\n海：请进。",[["进入图书馆","libraryEnter"]]);
}
function library(){
 state="library";setStatus();
 let s=DATA.title+"\n\n";
 DATA.sections.forEach((x,i)=>s+="["+(i+1)+"] "+x.name+"\n");
 s+="\n[sea] 海";
 s+="\n[0] 返回入口";
 if(pass?.admin)s+="\n[admin] 猫的房间";
 show(s,DATA.sections.map((x,i)=>[(i+1)+". "+x.name,String(i+1)]).concat([["海","sea"],pass?.admin?["编辑室","admin"]:null].filter(Boolean)));
}
function visibleBooks(sec){
 return sec.books.filter(b=>b.visibleTo.includes(pass?.id)||pass?.admin);
}
function saveFound(){try{localStorage.setItem("wucaitan_v04_found",JSON.stringify(survey.foundByShelf||{}))}catch(e){}}
function foundBooksForShelf(id){
 const ids=survey.foundByShelf?.[id]||[];
 return ids.map(bid=>visibleBooks(section).find(b=>b.id===bid)).filter(Boolean);
}
function markFound(sh,b){
 if(!survey.foundByShelf[sh.id])survey.foundByShelf[sh.id]=[];
 if(!survey.foundByShelf[sh.id].includes(b.id))survey.foundByShelf[sh.id].push(b.id);
 saveFound();
}
function showSection(sec){
 section=sec;state="scene";
 const shelves=(DATA.shelves?.[sec.id]||[]);
 let s="---------- "+sec.name+" ----------\n\n";
 if(sec.description)s+=sec.description+"\n\n";
 if(shelves.length){
  shelves.forEach((sh,i)=>{s+="["+(i+1)+"] "+sh.name+"\n";const found=foundBooksForShelf(sh.id);found.forEach(b=>s+="    · "+b.name+"\n")});
 }else{
  s+="这里是空的。\n";
 }
 s+="\n[0] 返回图书馆";
 const bs=[];shelves.forEach((sh,i)=>{bs.push([(i+1)+". "+sh.name,"shelf:"+sh.id]);foundBooksForShelf(sh.id).forEach(b=>bs.push(["查看《"+b.name+"》","found:"+b.id]))});
 bs.push(["返回","0"]);
 show(s,bs);
}
function shelfById(id){return (DATA.shelves?.[section?.id]||[]).find(x=>x.id===id)}
function visibleShelfBooks(sh){
 const all=visibleBooks(section);
 const foundElsewhere=new Set(Object.values(survey.foundByShelf||{}).flat());
 return all.filter(b=>(!b.shelf||b.shelf===sh.id)&&!foundElsewhere.has(b.id));
}
function beginShelfSurvey(id){
 const sh=shelfById(id);if(!sh){showSection(section);return}
 survey.shelf=id;survey.dialogIndex=0;survey.resultIndex=0;survey.results=[];
 const key=pass?.id&&DATA.shelfDialogues?.[pass.id]?pass.id:"default";
 survey.dialogLines=DATA.shelfDialogues?.[key]||DATA.shelfDialogues.default;
 state="shelfVN";showShelfLine();
}
function showShelfLine(){
 const i=survey.dialogIndex,lines=survey.dialogLines||[];
 if(i<lines.length){show(lines[i],[["继续","shelfNext"]]);return}
 state="surveyChoice";
 show("书架。\n\n要寻找书吗？",[["寻找","doSurvey"],["离开","leaveShelf"]]);
}
function shelfNext(){survey.dialogIndex++;showShelfLine()}
function makePlaceholderPool(){
 return [
  {kind:"plain",name:"书",lines:["只是书。"],weight:3},
  {kind:"odd",name:"封面奇怪的书",lines:["你看不懂里面的内容。"],weight:2},
  {kind:"sealed",name:"崭新到未开封的书",lines:["因为没有开封，你不敢打开看。"],weight:2},
  {kind:"empty",name:"没有封面的书",lines:["里面是空的。"],weight:2},
  {kind:"thief",name:"奇怪的书外壳",lines:["里面夹着一张卡片。","恭喜你，这本书已经被我偷走了！\n         ----怪盗"],weight:0.05}
 ];
}
function doSurvey(){
 const id=survey.shelf, sh=shelfById(id);
 const n=(survey.attempts[id]||0)+1;survey.attempts[id]=n;
 const books=visibleShelfBooks(sh);
 let pool=[];
 books.forEach(b=>pool.push({kind:"book",book:b,weight:Math.min(3+n,12)}));
 makePlaceholderPool().forEach(x=>pool.push(x));
 const count=Math.floor(Math.random()*4),picked=[],used=new Set();
 while(picked.length<count&&pool.length){
  const total=pool.reduce((a,x)=>a+x.weight,0);let r=Math.random()*total,idx=0;
  for(;idx<pool.length;idx++){r-=pool[idx].weight;if(r<=0)break}
  idx=Math.min(idx,pool.length-1);
  const x=pool.splice(idx,1)[0];
  const key=x.kind==="book"?"book:"+x.book.id:x.kind;
  if(!used.has(key)){used.add(key);picked.push(x)}
 }
 survey.results=picked;survey.resultIndex=0;state="surveyResult";showCurrentResult();
}
function showCurrentResult(){
 const item=survey.results?.[survey.resultIndex];
 if(!item){
  show("仔细寻找了一遍，没有发现什么有趣的书。",[["继续寻找","repeatSurvey"],["离开","leaveShelf"]]);return;
 }
 if(item.kind==="book")markFound(shelfById(survey.shelf),item.book);
 const title=item.kind==="book"?item.book.name:item.name;
 const line="发现了一本书："+title+"";
 const next=item.kind==="book"?["打开","openFound"]:["打开","openPlaceholder"];
 show(line,[[next[0],next[1]],["继续寻找","nextResult"],["离开","leaveShelf"]]);
}
function openPlaceholder(){
 const item=survey.results?.[survey.resultIndex];if(!item){showCurrentResult();return}
 state="placeholder";survey.dialogLines=item.lines||["里面什么也没有。"];survey.dialogIndex=0;showPlaceholderLine();
}
function showPlaceholderLine(){
 const lines=survey.dialogLines||[],i=survey.dialogIndex||0;
 if(i<lines.length){show(lines[i],[[i<lines.length-1?"继续":"返回调查结果",i<lines.length-1?"placeholderNext":"placeholderDone"]]);return}
 showCurrentResult();
}
function placeholderNext(){survey.dialogIndex++;showPlaceholderLine()}
function placeholderDone(){
 survey.dialogLines=[];survey.dialogIndex=0;
 state="surveyChoice";
 show("你把它放回原处。\\n\\n要继续调查吗？",[["继续调查","doSurvey"],["离开","leaveShelf"]]);
}
function nextResult(){survey.resultIndex++;showCurrentResult()}
function openFound(){const f=survey.results?.[survey.resultIndex];if(f&&f.kind==="book"){survey.returnToSurvey=true;openBook(f.book)}else openPlaceholder()}
function repeatSurvey(){beginShelfSurvey(survey.shelf)}
function leaveShelf(){survey.returnToSurvey=false;showSection(section)}

function openBook(b){book=b;page=0;showBookPage()}
function showBookPage(){
 state="book";const p=book.pages[page]||{text:"",image:"",caption:""};
 let s="---------- "+book.name+" ----------\n\n";
 s+="第 "+(page+1)+" / "+book.pages.length+" 页\n\n";
 if(p.image)s+="[图片]\n"+p.image+"\n"+(p.caption?p.caption+"\n":"")+"\n";
 s+=(p.text||"")+"\n\n";
 s+="[回车] 下一页";
 if(page>0)s+="\n[q] 返回书架";
 show(s);
}
function returnFromFoundBook(){survey.returnToSurvey=false;state="surveyChoice";show("你合上了《"+book.name+"》。\n\n要继续调查吗？",[["继续调查","repeatSurvey"],["离开","leaveShelf"]])}
function nextPage(){if(page<book.pages.length-1){page++;showBookPage()}else if(survey.returnToSurvey)returnFromFoundBook();else showSection(section)}

function isAdmin(){return !!pass?.admin}

function adminHome(){
 if(!isAdmin())return library();
 state="admin";
 show("================================\n        灯塔水母 · 编辑室\n================================\n\n"+
 "这里是五彩滩图书馆的内容管理区域。\n\n"+
 "[1] 图书馆主页\n[2] 引入与剧情\n[3] 通行证\n[4] 图书馆分区\n[5] 书目\n[6] 书页与图片\n[7] 权限与可见性\n[8] 数据\n[9] 主题颜色\n[10] 文字显示\n[B] 返回图书馆\n\n>",
 [["主页","1"],["剧情","2"],["通行证","3"],["分区","4"],["书目","5"],["书页","6"],["权限","7"],["数据","8"],["主题颜色","9"],["文字显示","10"]]);
}
function adminHomeChoice(x){
 if(x==="0"){library();return}
 if(x==="1")adminHomepage();
 else if(x==="2")adminStory();
 else if(x==="3")adminPasses();
 else if(x==="4")adminSections();

function exportWebsite(){
  const cloneDoc=document.documentElement.cloneNode(true);
  const script=cloneDoc.querySelector("script");
  if(script){
    // Embed the current edited DATA directly into the exported site's startup code.
    const embedded="const EMBEDDED_DATA="+JSON.stringify(DATA)+";\n";
    script.textContent=script.textContent.replace(
      'const DEFAULT_DATA=',
      embedded+'const DEFAULT_DATA='
    ).replace(
      'let DATA=loadData();',
      'let DATA=loadData();\nif(typeof EMBEDDED_DATA!=="undefined"){DATA=clone(EMBEDDED_DATA);localStorage.setItem("wucaitan_v02",JSON.stringify(DATA));}'
    );
  }
  const finalHtml="<!doctype html>\n"+cloneDoc.outerHTML;
  const blob=new Blob([finalHtml],{type:"text/html;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="index.html";
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
function downloadWebsite(){exportWebsite()}
function downloadData(){
 const blob=new Blob([JSON.stringify(DATA,null,2)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="wucaitan-library.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importData(){
 const input=document.createElement("input");input.type="file";input.accept=".json,application/json";input.onchange=()=>{
  const f=input.files?.[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{
   try{const x=JSON.parse(r.result);if(!x.passes||!x.sections||!x.story)throw Error();DATA=x;saveData();adminHome()}catch(e){show("导入失败：文件格式不正确。\n\n[回车] 返回");state="adminData"}};
  r.readAsText(f,"utf-8");
 };input.click();
}

function handle(raw){
 const x=String(raw??"").trim();
 if(x.toUpperCase()==="B" && state.startsWith("admin") && state!=="admin"){
  adminHome();
  return;
 }
 if(state==="entrance"){
  if(x==="R"){resetEverything();return}
  if(x==="r"){resetLocalEdits();return}
  if(x==="libraryEnter"||x.toLowerCase()==="library"){libraryEnter();return}
  if(x==="seaEnter"||x.toLowerCase()==="sea"){seaEnter();return}
  if(x==="reverify"){reverify();return}
  startStory();return;
 }
 if(state==="story"){chooseNode(x);return}
 if(state==="intro"){
  if(x==="1")verify();else if(x==="2")hint();else if(x==="r"){resetLocalEdits()}else if(x==="R"){resetEverything()}else startIntroFallback();return;
 }
 if(state==="hint"){startStory();return}
 if(state==="verify"){authenticate(x);return}
 if(state==="verifyFail"){startStory();return}
 if(state==="afterAuth"){if(x==="libraryEnter")library();else library();return}
 if(state==="seaMenu"){seaChoice(x);return}
 if(state==="seaDialog"){if(x==="nextSea")nextSea();else seaDialogue();return}
 if(state==="library"){
  if(x.toLowerCase()==="admin"&&isAdmin()){adminHome();return}
  if(x.toLowerCase()==="sea"){seaDialogue();return}
  if(x==="0"){startStory();return}
  const s=DATA.sections[+x-1];if(s)showSection(s);else library();return;
 }
 if(state==="scene"){
  if(x.toLowerCase()==="b"){library();return}
  if(x.startsWith("shelf:")){beginShelfSurvey(x.slice(6));return}
  if(x.startsWith("found:")){const f=visibleBooks(section).find(b=>b.id===x.slice(6));if(f){survey.returnToSurvey=false;openBook(f)}else showSection(section);return}
  const shelves=DATA.shelves?.[section.id]||[];const sh=shelves[+x-1];if(sh)beginShelfSurvey(sh.id);else showSection(section);return;
 }
 if(state==="shelfVN"){if(x==="shelfNext")shelfNext();else showShelfLine();return}
 if(state==="surveyChoice"){if(x==="doSurvey")doSurvey();else leaveShelf();return}
 if(state==="placeholder"){if(x==="placeholderNext")placeholderNext();else if(x==="placeholderDone")placeholderDone();else showPlaceholderLine();return}
 if(state==="surveyResult"){
  if(x==="surveyResultNext")surveyResultNext();else if(x==="openFound")openFound();else if(x==="openPlaceholder")openPlaceholder();else if(x==="repeatSurvey")repeatSurvey();else if(x==="leaveShelf")leaveShelf();return;
 }
 if(state==="book"){if(x.toLowerCase()==="q"){if(survey.returnToSurvey)returnFromFoundBook();else showSection(section)}else nextPage();return}
 if(state==="admin")adminHomeChoice(x);
 else if(state==="adminHomepage")adminHomepageChoice(x);
 else if(state==="adminStory")adminStoryChoice(x);
 else if(state==="adminPass")adminPassChoice(x);
 else if(state==="adminSection")adminSectionChoice(x);
 else if(state==="adminBook")adminBookChoice(x);
 else if(state==="adminPageSelect")adminPageSelectChoice(x);
 else if(state==="adminPage")adminPageChoice(x);
 else if(state==="adminVisibility")adminVisibilityChoice(x);
 else if(state==="adminData")adminDataChoice(x);
 else if(state==="adminTheme")adminThemeChoice(x);
 else if(state==="adminTypewriter")adminTypewriterChoice(x);
 else startStory();
}

startStory();
