ter;font:14px/1.7 system-ui,sans-serif;letter-spacing:.08em}.speaker:empty{display:none}.text{white-space:pre-wrap;min-height:82px;max-height:34vh;overflow:auto;padding-top:7px;line-height:2;font-size:clamp(15px,2vw,18px);color:#493a2b}.controls{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid #e5d7c4;padding-top:12px;margin-top:10px;font:12px/1.5 system-ui,sans-serif;color:var(--muted)}.controlgroup{display:flex;gap:7px;flex-wrap:wrap}.controls button{border:1px solid rgba(197,167,121,.35);background:transparent;color:#6f5c47;border-radius:2px;padding:6px 10px;font:12px system-ui,sans-serif;cursor:pointer}.controls button:hover{background:#eee2cf;color:#493a2b}.progress{font-variant-numeric:tabular-nums}.hint{color:#8b7b68;font:12px system-ui,sans-serif;margin-top:9px;text-align:right}.endingmark{color:var(--gold);font-size:12px;letter-spacing:.25em;margin-top:12px}button[hidden]{display:none!important}@media(max-width:600px){.stage{padding:12px}.stage:before{inset:6px}.topline{font-size:10px}.scene{padding:20px 0;min-height:130px}.dialogue{padding:24px 15px 14px}.speaker{left:14px}.text{min-height:95px;max-height:31vh}.controls{align-items:flex-start}.controlgroup{width:100%}.controls button{flex:1}.choices{margin-bottom:14px}}
</style></head><body><main class="stage"><header class="topline"><div class="storyname">五彩滩图书馆　/　故事后旅馆</div><div class="chapter" id="chapter">故事剧场</div></header><section class="scene"><div class="nodetitle" id="title"></div><div class="ornament"></div></section><div id="choices" class="choices"></div><section class="dialogue"><div id="speaker" class="speaker"></div><div id="text" class="text"></div><div class="controls"><span id="progress" class="progress"></span><div class="controlgroup"><button id="next">继续　›</button><button id="save">显示存档 ID</button><button id="load">载入存档 ID</button><button id="restart">重新开始</button></div></div><div id="hint" class="hint">点击继续阅读</div></section></main><script>const s={"title":"故事后旅馆","start":"intro","nodes":[{"id":"intro","title":"《故事后旅馆》预告","x":57.05882263183594,"y":67.2548828125,"pages":[{"text":"你好"},{"text":"这是我为五彩滩图书馆特别准备的第一个互动幽灵故事《故事后旅馆》的预告"},{"text":"如今故事已经完成了主要情节的制作，用于编辑，所以我给这个故事最有可能的读者寄送了这个预告，如果可以，请好好看看里面的内容。"}],"type":"scene","speaker":"","note":"","tags":[],"color":"sand","choices":[{"text":"了解故事","target":"about"}]},{"id":"about","title":"了解故事","x":390,"y":220,"pages":[{"text":"请选择你想了解的内容。"}],"type":"scene","speaker":"","note":"","tags":[],"color":"sand","choices":[{"text":"关于《故事后旅馆》","target":"preview"},{"text":"有趣的核心","target":"core"},{"text":"幽灵","target":"ghost"},{"text":"角色","target":"characters"},{"text":"做到哪一步了","target":"progress"},{"text":"可能会让人沮丧的部分","target":"concerns"},{"text":"返回预告","target":"intro"}]},{"id":"preview","title":"关于《故事后旅馆》","x":710,"y":70,"pages":[{"text":"《故事后旅馆》是一个关于“故事”的五人四天紧凑侦探推理故事，"},{"text":"主角收到邀请，乘坐列车来到海中一个奇异之地，在由船做成的城市里的一个旅馆中遭遇暴风雪山庄式的案件，大概就是这样的故事。"},{"text":"因为是为了“让大家都觉得有趣又奇异”而制作的故事，所以去掉了平时很多猫的风格，尽量不会让任何人觉得谜语又无聊。"},{"text":"故事的形式从一开始就确定为“可以有比较多参与感的互动故事”，随后因此制作了专属于图书馆的故事引擎。具体的效果如你所见"},{"text":"故事引擎目前还不能开放给任何其他人类使用，除非你很确定你是一位合格又不怕困难的故事家。"}],"type":"scene","speaker":"","note":"","tags":[],"color":"sand","choices":[{"text":"返回了解故事","target":"about"}]},{"id":"core","title":"有趣的核心","x":710,"y":250,"pages":[{"text":"虽然“短篇侦探推理游戏”本身已经很让人感兴趣，不过作为特别准备的奇异侦探故事，有一些非常有趣的核心部分，毕竟，这可是在一个有魔法，幽灵和故事家的世界里扮演侦探"},{"text":"规则推理"},{"text":"在一个奇异到常识并不太有效的世界里面，围绕某种确定的“规则”而不是平时的认识来推理是这个侦探故事的核心。"},{"text":"例如，在一个事件里，主角会得知“旅馆的房间所对应的四个要解决的事件，在时间上是确定对称的”这样的定理"},{"text":"那么这个规则就可以代替常识，成为搭建推理的桥梁，从而得出出乎意料的结论。"},{"text":"故事中每一天的谜题和最终的核心诡计，都围绕房间，旅馆和角色自己所带有的规则展开"},{"text":"随着故事到达尾声，面对难以击败的铁证，主角也将不断使用过去故事里确定下的那些规则，制造出惊人的反转。"},{"text":"依靠确定的规则，打破表面真实的“定论”，得出奇异真相的过程，希望能成为这个故事的迷人之处。"}],"type":"scene","speaker":"","note":"","tags":[],"color":"sand","choices":[{"text":"返回了解故事","target":"about"}]},{"id":"ghost","title":"幽灵","x":710,"y":430,"pages":[{"text":"故事中，并没有“死亡”这样的概念，取而代之的是“变成幽灵”。变成幽灵之后有许多不同的走向，比如消散不见，或者变成带有奇怪执念的存在。但绝大多数幽灵都不能再参与到故事中。"},{"text":"常规的在现实中杀死某人的手段并不能在这里让人变成幽灵，能够让角色以幽灵下场的方式都是关于心以及某些规则的。所以，常规的案件手推理手法往往不会太有用。"},{"text":"幽灵在故事中，仍然保持着“存在”的状态，并且发生着某些不起眼且必要的功能。例如，除了参与推理的五位主要角色之外，旅馆中其他的人员都由幽灵扮演"},{"text":"这个故事中的幽灵，使用的是《松鼠侦探》中的幽灵概念，关于《故事后旅馆》与其他故事的关系，请看下一条。"}],"type":"scene","speaker":"","note":"","tags":[],"color":"sand","choices":[{"text":"返回了解故事","target":"about"}]},{"id":"characters","title":"角色","x":970,"y":70,"pages":[{"text":"故事中的五个角色关联着许多不同的故事，关于他们如何聚集到一起，已经不同故事如何统合的部分，暂时保密。"},{"text":"目前可以透露的名字是：戴宽帽子的狐狸，穿大衣的女士，怪鸟侦探，气象员"}],"type":"scene","speaker":"","note":"","tags":[],"color":"sand","choices":[{"text":"返回了解故事","target":"about"}]},{"id":"progress","title":"做到哪一步了","x":970,"y":250,"pages":[{"text":"每一天会发生的重要事件，每天的谜题，用于推理的规则还有最终的诡计都已经完成了"},{"text":"因为花了很久去设计，应该不会有出现有巨大错误的内容。"},{"text":"故事引擎也已经确定下来，具体的部分正在制作文本，但是完整的制作果然还是要很长的时间，可能会先做出前几天的内容。"},{"text":"如果你感兴趣，请表示支持，谢谢。"}],"type":"scene","speaker":"","note":"","tags":[],"color":"sand","choices":[{"text":"返回了解故事","target":"about"}]},{"id":"concerns","title":"可能会让人沮丧的部分","x":970,"y":430,"pages":[{"text":"由于文本本身就需要许多时间，情节关联到许多没有人知道的故事又只能由我来完成，更新周期可能会很漫长。"},{"text":"除此之外，因为不久之前接触到一款非常厉害的奇异推理游戏，这个故事在推理侦探内容的灵魂上可能会有与之相似的地方。"},{"text":"为了避免这样，可能会做一些修改。我会尽量让它看起来不要很奇怪"}],"type":"scene","speaker":"","note":"","tags":[],"color":"sand","choices":[{"text":"返回了解故事","target":"about"}]}]};let id=s.start,p=0;const $=x=>document.getElementById(x),get=id=>s.nodes.find(n=>n.id===id),pageId=()=>id+'::'+p;function draw(){let n=get(id),pg=n?.pages[p];$('title').textContent=n?.title||'故事结束';$('speaker').textContent=pg?.useSpeaker?(pg.speaker||''):(n?.speaker||'');$('text').textContent=pg?.text||'故事结束。';$('choices').innerHTML='';$('progress').textContent=n?'阅读进度　'+(p+1)+' / '+n.pages.length:'';$('chapter').textContent=n?.type==='ending'?'结局':'故事剧场';$('hint').textContent=n?'':'故事已结束。';$('next').hidden=!n||p>=n.pages.length-1||n.type==='ending';if(n&&(p===n.pages.length-1||n.type==='ending'))n.choices.forEach(c=>{let b=document.createElement('button');b.textContent=c.text;b.onclick=()=>{if(!get(c.target)){$('hint').textContent='这条分支尚未连接到故事节点。';return}id=c.target;p=0;draw()};$('choices').appendChild(b)});if(n&&!n.choices.length&&p===n.pages.length-1)$('hint').textContent='故事到这里结束。'}$('next').onclick=()=>{let n=get(id);if(n&&p<n.pages.length-1){p++;draw()}else if(n?.choices.length===1){if(!get(n.choices[0].target)){$('hint').textContent='这条分支尚未连接到故事节点。';return}id=n.choices[0].target;p=0;draw()}else if(n?.choices.length>1)$('hint').textContent='请选择一个选项继续。'};$('restart').onclick=()=>{id=s.start;p=0;draw()};$('save').onclick=()=>{let old=$('saveid');if(old){old.remove();return}let box=document.createElement('input');box.id='saveid';box.readOnly=true;box.value=pageId();box.title='复制此页面 ID 以保存进度';box.style.cssText='width:100%;margin-top:8px;padding:8px;border:1px solid #d6c5ac;background:#fffaf2;color:#493a2b';$('hint').before(box);box.focus();box.select();$('hint').textContent='当前页面存档 ID 已显示，请复制并妥善保存。'};$('load').onclick=()=>{let old=$('loadid');if(old){let raw=old.value.trim();let parts=raw.split('::');let target=parts[0],page=Number(parts[1]);let n=get(target);if(n&&Number.isInteger(page)&&page>=0&&page<n.pages.length){id=target;p=page;draw();$('hint').textContent='存档 ID 载入成功。';old.remove()}else $('hint').textContent='存档 ID 无效，请检查后重试。';return}let box=document.createElement('input');box.id='loadid';box.placeholder='输入页面 ID，例如 nxxxxxx::0';box.style.cssText='width:100%;margin-top:8px;padding:8px;border:1px solid #d6c5ac;background:#fffaf2;color:#493a2b';$('hint').before(box);box.focus();$('hint').textContent='输入页面 ID 后再次点击“载入存档 ID”。'};draw();</script></body></html>
